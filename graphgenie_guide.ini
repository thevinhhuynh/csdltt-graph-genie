; HƯỚNG DẪN CẤU HÌNH GRAPHGENIE
; Giải thích theo mã nguồn hiện tại: main.py, query_generator.py, query_mutator.py.
; Các giá trị cấu hình được giữ nguyên như graphgenie.ini tại lúc tạo hướng dẫn.
;
; GraphGenie sinh truy vấn gốc, biến đổi thành các truy vấn tương đương hoặc
; truy vấn có điều kiện chặt hơn, rồi so sánh kết quả để phát hiện lỗi tiềm ẩn.
; Việc so sánh tập trung vào giá trị count(...), không so sánh toàn bộ bảng kết quả.
;
; CÁCH SỬ DỤNG
; Chương trình hiện đọc cố định graphgenie.ini từ thư mục làm việc hiện tại.
; graphgenie_guide.ini là bản có chú thích, không được tự động nạp.
; Muốn áp dụng thay đổi, sửa giá trị tương ứng trong graphgenie.ini hoặc chép
; nội dung bản hướng dẫn này vào graphgenie.ini, rồi chạy python3 main.py.
; Dòng bắt đầu bằng dấu ; là chú thích và không được thực thi.
; Đường dẫn tương đối như ./testing.log được tính từ thư mục chạy chương trình.
;
; QUY ƯỚC
; Các công tắc nên dùng 0 = tắt, 1 = bật. Một số nhánh kiểm tra giá trị khác 0,
; nhưng perf_issue được kiểm tra chính xác bằng 1.
; Các xác suất *_rate nên nằm trong [0, 1]: 0 = không chọn, 1 = luôn chọn.
; Bộ sinh dùng randint(1, 100), nên xác suất thực tế có độ phân giải 1 phần trăm.
; Mã hiện tại chưa kiểm tra đầy đủ miền giá trị của các tham số.
; [CHƯA ÁP DỤNG] nghĩa là tham số tồn tại nhưng chưa chi phối hành vi hiện tại.

[default]

; Hệ quản trị cơ sở dữ liệu đồ thị cần kiểm thử.
; main.py có nhánh kết nối cho neo4j, redisgraph và agensgraph.
; Với neo4j + cypher, chương trình tự quét nhãn và quan hệ kết nối của dữ liệu.
; Với các hệ khác, phải sửa node_labels, edge_labels, node_properties và
; connectivity_matrix trong main.py cho phù hợp dữ liệu thực tế.
; Chương trình không tự khởi tạo bộ dữ liệu đồ thị để kiểm thử.
graphdb = neo4j

; Địa chỉ máy chủ cơ sở dữ liệu. 127.0.0.1 là máy chạy chương trình.
; Neo4j sử dụng địa chỉ bolt://<ip>:<port> để kết nối.
ip = 127.0.0.1

; Cổng kết nối của máy chủ. Giá trị cần khớp với dịch vụ đang chạy.
; Ví dụ trong cấu hình gốc: Neo4j 7687, RedisGraph 6379, AgensGraph 5432.
port = 7687

; Tài khoản đăng nhập; được dùng khi kết nối Neo4j và AgensGraph.
; Nhánh RedisGraph hiện tạo redis.Redis(host=..., port=...), không truyền
; username hoặc password, nên hai giá trị này chưa có tác dụng với nhánh đó.
username = neo4j

; Mật khẩu tương ứng với tài khoản trên, được lưu dưới dạng văn bản trong INI.
; Giá trị dưới đây được sao chép từ cấu hình gốc, cần khớp tài khoản trên máy chủ.
password = 12344321

; Ví dụ kết nối RedisGraph: bỏ dấu ; của nhóm dưới và thay nhóm đang hoạt động.
; Không bật hai nhóm cùng lúc vì ConfigParser không chấp nhận khóa trùng lặp.
; graphdb = redisgraph
; ip = 127.0.0.1
; port = 6379
; username = test
; password = test
; Nhánh này hiện chọn tên đồ thị "db" cố định trong RedisGraphTesting.

; Ví dụ kết nối AgensGraph, cũng chỉ bật một nhóm kết nối tại một thời điểm.
; graphdb = agensgraph
; ip = 127.0.0.1
; port = 5432
; username = postgres
; password = agensgraph
; Nhánh này hiện thực thi SET graph_path = t, tức chọn đồ thị tên "t".

; Ngôn ngữ truy vấn. Bản mã nguồn hiện tại sinh truy vấn Cypher.
; README cho biết mã kiểm thử Gremlin chưa được phát hành; chỉ đổi thành
; gremlin không đủ để có một quy trình kiểm thử Gremlin hoạt động.
language = cypher

[testing_configs]

; Bật sinh và chạy thêm các truy vấn có điều kiện chặt hơn (restricted queries).
; Ví dụ: thêm hướng cạnh, nhãn cạnh, nhãn nút hoặc thêm nút vào mẫu truy vấn.
; Với kết quả đếm hợp lệ, mã đánh dấu nghi ngờ nếu kết quả restricted lớn hơn
; kết quả gốc. Đây là một tiêu chí khác với yêu cầu hai kết quả phải bằng nhau.
; 0 = chỉ chạy nhóm tương đương; 1 = chạy thêm nhóm restricted.
; Nhóm restricted được chạy tuần tự, kể cả khi multi_threading = 1.
variant = 1

; 1 = chạy mỗi truy vấn tương đương trong một luồng Python riêng.
; 0 = chạy tuần tự. Truy vấn gốc được chạy trước các truy vấn biến đổi.
; Chương trình đợi tất cả luồng của truy vấn gốc hiện tại kết thúc rồi mới
; sinh truy vấn gốc tiếp theo. Số luồng phụ thuộc số truy vấn tương đương sinh ra.
; Mã hiện dùng chung một số bộ đếm và thao tác ghi log giữa các luồng,
; chưa có cơ chế đồng bộ đầy đủ; chạy đồng thời cũng ảnh hưởng phép đo thời gian.
multi_threading = 1

; [CHƯA ÁP DỤNG] Dự kiến giới hạn số luồng đồng thời.
; main.py chưa đọc khóa này và vẫn tạo một luồng cho mỗi truy vấn tương đương.
; Đặt 8 ở đây hiện không đảm bảo chương trình chỉ chạy tối đa 8 luồng.
max_thread_num = 8

; Số vị trí nút ban đầu trong mẫu đường đi, không phải số nút của cơ sở dữ liệu.
; 2 thường tạo mẫu hai nút nối bởi một cạnh, ví dụ (a)-[]-(b).
; Giá trị này được nạp lại khi bắt đầu mỗi vòng kiểm thử; nên dùng số nguyên >= 2.
; Bộ sinh tăng số vị trí nút lên 1 khi mẫu nhãn liên tiếp bị lặp đủ
; 2 * _node_num * _node_num lần. Mẫu không nhãn được mã hóa bằng 0.
; min_node_num và max_node_num bên dưới hiện chưa giới hạn quá trình này.
_node_num = 2

; File ghi các cặp truy vấn nghi ngờ lỗi logic khi kết quả đếm không nhất quán.
; Ghi truy vấn gốc, truy vấn tương đương, kết quả và thời điểm phát hiện.
; Lỗi restricted và cảnh báo hiệu năng hiện chỉ được ghi vào logpath,
; không được ghi qua bug_log() vào file này.
bug_logpath = ./bug.log

; File nhật ký chính: truy vấn, kết quả, thời gian chạy, thống kê và cảnh báo.
; Nội dung được ghi nối tiếp bằng chế độ a+.
logpath = ./testing.log

; File ghi ngoại lệ khi thực thi truy vấn, gồm truy vấn và thông tin lỗi.
; except_log() hiện bỏ qua thông báo chứa chuỗi "imeout", nên các lỗi timeout
; phù hợp điều kiện đó không được ghi vào file ngoại lệ này.
exception_logpath = ./exception.log

; Ngưỡng kích thước file testing.log, đơn vị byte; 4096 byte = 4 KiB.
; Khi khởi tạo, nếu file tại logpath đã tồn tại và lớn hơn ngưỡng này,
; file được chuyển vào ./logs/testing.log-<timestamp> trước khi ghi log mới.
; File không vượt ngưỡng được giữ lại và tiếp tục ghi nối tiếp.
; Đây là ngưỡng lưu log cũ, không phải giới hạn dung lượng log trong lúc chạy.
; bug_logpath và exception_logpath, nếu tồn tại, được chuyển vào ./logs/
; không phụ thuộc ngưỡng này. init_log() chỉ được gọi khi logpath đã tồn tại.
; Thư mục ./logs/ cần tồn tại vì init_log() không tự tạo thư mục.
min_save_log_size = 4096

; Số lượng mục tiêu của nhóm truy vấn tương đương cho mỗi truy vấn gốc.
; Các quy tắc ban đầu chạy trước; với Cypher trên hệ khác AgensGraph,
; bộ biến đổi tiếp tục áp dụng quy tắc lặp cho đến khi đạt ít nhất số này.
; Đây không phải giới hạn cứng: nhóm quy tắc ban đầu có thể sinh nhiều hơn.
; Với AgensGraph, nhánh sinh lặp bị bỏ qua nên có thể không đạt số mục tiêu.
; Các truy vấn restricted do variant sinh ra không được tính vào mục tiêu này.
mutated_query_num = 30

; [CHƯA ÁP DỤNG] Dự kiến giới hạn số truy vấn kiểm thử.
; Giá trị được đọc vào self.max_testing_query_num, nhưng vòng lặp testing()
; không dùng nó để dừng. Đặt 2000 hiện KHÔNG làm chương trình dừng ở 2000.
max_testing_query_num = 2000

; Số vòng kiểm thử dự kiến; mỗi vòng khởi tạo lại bộ sinh và một số bộ đếm.
; Tuy nhiên bên trong mỗi vòng hiện có while True không có điều kiện thoát.
; Vì vậy một lần chạy bình thường cứ tiếp tục ở vòng đầu, và tăng giá trị này
; không khiến chương trình tự chuyển sang các vòng tiếp theo.
; Người chạy cần dừng thủ công, ví dụ Ctrl+C, hoặc bổ sung điều kiện dừng vào mã.
testing_times = 1

; [CHƯA ÁP DỤNG] Công tắc dự kiến cho chế độ thu thập thống kê đánh giá.
; main.py đọc giá trị nhưng không dùng làm điều kiện bật/tắt thống kê.
; Đổi thành 0 hiện không tắt việc ghi thống kê hoặc cập nhật bộ đếm quy tắc.
statistics = 1

; Chu kỳ ghi dòng tổng kết số truy vấn gốc và thống kê quy tắc vào logpath.
; 30 nghĩa là ghi khi bộ đếm truy vấn gốc chia hết cho 30: 0, 30, 60, ...
; Không phải số giây và không phải chu kỳ theo tổng số truy vấn biến đổi.
; Nên dùng số nguyên > 0; đặt 0 gây lỗi phép chia lấy dư trong testing().
logging_stop = 30

; 1 = kiểm tra thêm chênh lệch hiệu năng giữa truy vấn gốc và tương đương.
; 0 = bỏ qua phép kiểm tra này; truy vấn vẫn chạy và được ghi thời gian.
; Việc kiểm tra kết quả logic không phụ thuộc công tắc này.
; Nhóm restricted hiện không gọi hàm kiểm tra hiệu năng variant_time_checking().
perf_issue = 1

; Ngưỡng tỷ lệ thời gian, không có đơn vị, dùng cho nhóm truy vấn tương đương.
; diff = max(t_goc, t_tuong_duong) / min(t_goc, t_tuong_duong).
; Mã báo nghi ngờ khi đồng thời: diff > threshold,
; t_tuong_duong > 50.0 ms và t_tuong_duong < t_goc.
; Ngoài ra t_goc phải vượt minimum_test_ms và perf_issue phải bằng 1.
; Ví dụ t_goc = 500 ms, t_tuong_duong = 80 ms: diff = 6.25 > 5,
; nên thỏa điều kiện cảnh báo. Chiều truy vấn tương đương chậm hơn hiện không báo.
; Ngưỡng lớn hơn làm tiêu chí tỷ lệ nghiêm ngặt hơn; nên đặt > 1.
threshold = 5

; [CHƯA ÁP DỤNG TRONG LUỒNG CHẠY] Ngưỡng tỷ lệ cho variant_time_checking().
; Hàm đó kiểm tra diff > variant_threshold và truy vấn biến thể chậm hơn gốc.
; Hàm được định nghĩa nhưng testing() hiện không gọi, nên đổi giá trị này
; chưa ảnh hưởng việc phát hiện hiệu năng trong quy trình chạy hiện tại.
variant_threshold = 2

; Thời gian tối thiểu của truy vấn GỐC để thực hiện phép kiểm tra hiệu năng,
; đơn vị mili giây. Chỉ kiểm tra khi base_time > minimum_test_ms.
; Đây không phải timeout và không ngăn truy vấn nhanh hơn được thực thi.
; Hàm time_checking() vẫn có điều kiện 50.0 ms cố định riêng cho truy vấn
; tương đương; thay giá trị dưới đây không thay hằng số 50.0 đó.
minimum_test_ms = 50.0

[query_generation_args]

; [CHƯA ÁP DỤNG] Số vị trí nút tối thiểu dự kiến của mẫu đường đi.
; Giá trị được đọc nhưng path_generator() dùng _node_num, không dùng min_node_num.
; Vì vậy min_node_num = 3 không ngăn mẫu ban đầu có 2 vị trí nút.
min_node_num = 3

; [CHƯA ÁP DỤNG] Số vị trí nút tối đa dự kiến của mẫu đường đi.
; Bộ sinh hiện không kiểm tra giá trị này khi tăng _node_num.
; Đặt 8 chưa đảm bảo mẫu đường đi luôn có tối đa 8 vị trí nút.
max_node_num = 8

; Xác suất thêm biểu thức độ dài biến đổi vào mỗi đơn vị cạnh được sinh.
; 0.2 tương ứng 20 phần trăm; mã chọn một trong *..1, *0..1, *0..0, *1..1.
; Ví dụ (a)-[*0..1]-(b) cho phép độ dài quan hệ từ 0 đến 1.
; Các lựa chọn độ dài hiện là danh sách cố định, không có cấu hình cận riêng.
variable_pathlen_rate = 0.2

; Xác suất gán tên biến ngẫu nhiên cho một vị trí nút trong mẫu thông thường.
; 0.7 tương ứng 70 phần trăm: (abcdefgh); khi không gán biến có thể là ().
; Tên biến giúp bộ sinh dùng nút trong WHERE, count(...) và các phép biến đổi.
; Với đường đi chu trình, hai đầu được thay bằng cyclic_symbol riêng.
node_symbol_rate = 0.7

; Xác suất gán tên biến cho cạnh, ví dụ -[abcdefgh]- thay vì -[]-.
; 0 hiện không sinh tên biến cạnh trong mẫu thông thường.
; Việc gán nhãn cạnh bên dưới còn yêu cầu tên biến cạnh khác rỗng.
edge_symbol_rate = 0

; Xác suất thử gán nhãn nút, ví dụ (abcdefgh:Person).
; Với mẫu thông thường, chỉ gán nếu nút có tên biến và có nhãn kết nối phù hợp.
; Vì vậy 0.5 không có nghĩa đúng một nửa tất cả các nút sẽ được gán nhãn.
; Trường hợp chu trình còn dùng xác suất này để chọn nhãn cho hai đầu chu trình.
node_label_rate = 0.5

; Xác suất thử gán kiểu/nhãn quan hệ cho cạnh, ví dụ -[abcdefgh:KNOWS]-.
; Điều kiện bổ sung trong random_path_unit(): cạnh phải có tên biến.
; Với edge_symbol_rate = 0 hiện tại, nhãn cạnh sẽ không được gán ở bước sinh
; mẫu cơ sở, dù edge_label_rate = 0.5; các phép biến đổi có thể thêm nhãn sau đó.
edge_label_rate = 0.5

; Xác suất chọn biểu thức nhiều nhãn khi gán nhãn nút, chỉ có tác dụng khi
; graphdb = neo4j và multi_node_labels khác 0, đồng thời nút đủ điều kiện gán nhãn.
; Mã tạo chuỗi phân cách bằng |, ví dụ Person|Actor; không tạo Person:Actor.
; Đây là cách biểu diễn của bộ sinh hiện tại, không có nghĩa nút bắt buộc
; đồng thời mang tất cả các nhãn; cần đối chiếu cú pháp với máy chủ đang kiểm thử.
multi_node_label_rate = 0.5

; [CHƯA ÁP DỤNG] Xác suất dự kiến để sinh nhiều nhãn/kiểu quan hệ.
; Giá trị được đọc nhưng random_path_unit() hiện chỉ chọn một nhãn cạnh.
multi_edge_label_rate = 0.5

; Xác suất biến đường đi thành chu trình: hai đầu dùng cùng cyclic_symbol.
; 0.2 tương ứng 20 phần trăm; ví dụ (cccccccc)-[]-(b)-[]-(cccccccc).
; Hai đầu cùng biến nghĩa là cùng một nút, không phải hai nút độc lập.
; Với mẫu chỉ hai vị trí nút, dạng này có thể trở thành một cạnh tự nối.
cyclic_rate = 0.2

; 0 = mỗi lần gán nhãn nút chỉ chọn một nhãn.
; 1 = cho phép nhánh sinh nhiều nhãn, với xác suất multi_node_label_rate,
; nhưng chỉ được sử dụng trong nhánh graphdb = neo4j.
; Nhánh nhiều nhãn chọn từ 2 đến số nhãn đã quét, nên cần ít nhất 2 nhãn.
; Các nhãn được chọn có thể lặp lại vì mã dùng choice(), không loại trùng.
multi_node_labels = 0

; [CHƯA ÁP DỤNG] Công tắc dự kiến cho nhiều nhãn/kiểu quan hệ.
; Có hàm random_edge_types() tạo chuỗi A|B, nhưng đường sinh truy vấn hiện tại
; không gọi hàm này và không kiểm tra công tắc multi_edge_labels.
multi_edge_labels = 0

; [CHƯA ÁP DỤNG] Xác suất dự kiến để thêm điều kiện WHERE.
; Khóa này chưa được đọc trong query_generator.py.
; random_query_generator() luôn gọi predicate_generator(), nên vẫn có WHERE:
; một biến nút IS NOT NULL AND True nếu có biến nút, hoặc WHERE True nếu không.
predicate_rate = 0.5

; Độ dài tên biến ngẫu nhiên, gồm các chữ cái thường a-z, ví dụ abcdefgh.
; Bộ sinh và bộ biến đổi đều dùng giá trị này để nhận diện biến bằng regex.
; Nên dùng số nguyên dương; đổi độ dài cần đổi cyclic_symbol cho khớp.
random_symbol_len = 8

; Tên biến dành cho nút đầu/cuối của đường đi chu trình.
; Phải có độ dài bằng random_symbol_len để các bước phân tích nhận diện đúng.
; Nên dùng chữ thường a-z tương tự tên biến sinh ngẫu nhiên.
