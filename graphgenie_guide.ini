[testing_strategy]

; 1 = bật các quy tắc biến đổi mẫu đồ thị có kiểm tra công tắc này,
; ví dụ tách đường đi, thêm nhãn hoặc hướng cạnh và nhiều quy tắc khác.
; 0 = những quy tắc đó trả về ngay, không sinh truy vấn biến đổi tương ứng.
; Đây không phải công tắc tắt toàn bộ bộ biến đổi: một số quy tắc vẫn chạy,
; như thêm AND True, thay AND bằng WITH * WHERE, hoặc mở chu trình.
; Mục tiêu mutated_query_num vẫn được xử lý bởi nhánh sinh tương đương.
graph_pattern_mutation = 1
